name: CI
on: [push]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          marker = s.index("fn draw(")
          s = s[:marker] + '''fn draw(f: &mut Frame, a: &App) {
    let area = f.area();
    let layout = Layout::vertical([
        Constraint::Length(1),
        Constraint::Min(3),
        Constraint::Length(2),
        Constraint::Length(1),
    ]).split(area);
    let provider = PROVIDERS[a.provider].name;
    let model = a.config.model.as_deref().unwrap_or("auto");
    f.render_widget(Paragraph::new(Line::from(vec![
        Span::raw("  "), "TERM CODE".bold().cyan(), Span::raw("  ·  "),
        provider.dim(), Span::raw(" / "), model.dim(),
    ])), layout[0]);
    match a.mode {
        Mode::Chat => chat(f, a, layout[1]),
        Mode::Setup(step) => setup(f, a, layout[1], step),
        Mode::Models => picker(f, &a.models, &a.model_state, layout[1], "Models"),
        Mode::Providers => {
            let names = PROVIDERS.iter().map(|p| p.name.to_string()).collect::<Vec<_>>();
            picker(f, &names, &a.provider_state, layout[1], "Providers");
        }
    }
    let prompt = match a.mode {
        Mode::Chat => {
            if a.input.is_empty() {
                Line::from(vec!["  › ".bold().cyan(), "Ask anything…".dim()])
            } else {
                Line::from(vec!["  › ".bold().cyan(), a.input.as_str().into()])
            }
        }
        Mode::Setup(step) => setup_prompt(a, step),
        _ => Line::from("  ↑/↓ navigate  ·  Enter select  ·  Esc back".dim()),
    };
    f.render_widget(Paragraph::new(prompt), layout[2]);
    let status = if let Some(e) = a.error.as_deref() {
        Line::from(vec!["  ! ".red().bold(), e.red()])
    } else if a.busy {
        Line::from(vec!["  • ".magenta(), "Working…".dim()])
    } else {
        Line::from(vec!["  ".into(), a.status.as_str().dim(), "  ·  ".dim(), "/help".cyan(), "  /model  /provider  /new  /quit".dim()])
    };
    f.render_widget(Paragraph::new(status), layout[3]);
}

fn chat(f: &mut Frame, a: &App, area: Rect) {
    if a.messages.is_empty() {
        let lines = vec![
            Line::from(""),
            Line::from(vec!["  ".into(), a.greeting.as_str().bold()]),
            Line::from(""),
            Line::from(vec!["  ".into(), "Start with a question, idea, or task.".dim()]),
            Line::from(""),
            Line::from(vec!["  ".into(), "Commands".bold()]),
            Line::from(vec!["  ".into(), "/model".cyan(), "  choose a model".dim()]),
            Line::from(vec!["  ".into(), "/provider".cyan(), "  switch provider".dim()]),
            Line::from(vec!["  ".into(), "/new".cyan(), "  start a fresh conversation".dim()]),
        ];
        f.render_widget(Paragraph::new(lines).wrap(Wrap { trim: false }), area);
        return;
    }
    let mut lines = Vec::new();
    for message in &a.messages {
        if message.role == "user" {
            lines.push(Line::from(vec!["  › ".cyan().bold(), message.content.as_str().bold()]));
        } else {
            lines.push(Line::from(vec!["  Term Code ".magenta().bold()]));
            for (i, line) in message.content.lines().enumerate() {
                lines.push(Line::from(vec![if i == 0 { "  ".into() } else { "    ".into() }, line.into()]));
            }
        }
        lines.push(Line::from(""));
    }
    f.render_widget(Paragraph::new(lines).scroll((a.scroll, 0)).wrap(Wrap { trim: false }), area);
}

fn setup(f: &mut Frame, a: &App, area: Rect, step: u8) {
    let inner = Layout::vertical([Constraint::Length(3), Constraint::Length(1), Constraint::Length(1), Constraint::Min(3)]).split(area);
    let title = match step { 0 => "Connect a provider", 1 => "Add your API key", 2 => "Personalize Term Code", _ => "Configuration error" };
    f.render_widget(Paragraph::new(title.bold().cyan()), inner[0]);
    match step {
        0 => {
            let items = PROVIDERS.iter().enumerate().map(|(i, p)| {
                Line::from(vec![if i == a.provider { "  › ".cyan().bold() } else { "    ".into() }, p.name.into(), if i == a.provider { "  selected".dim() } else { "".into() }])
            }).collect::<Vec<_>>();
            f.render_widget(Paragraph::new(items), inner[3]);
        }
        1 => f.render_widget(Paragraph::new(Line::from(vec!["  ".into(), "API key: ".dim(), "•".repeat(a.api_input.len()).into()])), inner[3]),
        2 => f.render_widget(Paragraph::new(Line::from(vec!["  ".into(), "Name: ".dim(), a.name_input.as_str().into()])), inner[3]),
        _ => f.render_widget(Paragraph::new(vec![Line::from(""), Line::from(vec!["  ".into(), a.error.as_deref().unwrap_or("Invalid Config.json").red()]), Line::from(""), Line::from("  Press Esc or Q to exit.".dim())]), inner[3]),
    }
}

fn setup_prompt(a: &App, step: u8) -> Line<'_> {
    match step {
        0 => Line::from("  ↑/↓ choose provider  ·  Enter continue  ·  Esc quit".dim()),
        1 => Line::from(vec!["  › ".bold().cyan(), "API key".dim()]),
        2 => Line::from(vec!["  › ".bold().cyan(), a.name_input.as_str().into()]),
        _ => Line::from("  Esc / Q exit".dim()),
    }
}

fn picker(f: &mut Frame, values: &[String], state: &ListState, area: Rect, title: &str) {
    let mut lines = vec![Line::from(vec!["  ".into(), title.bold().cyan()]), Line::from("")];
    for (i, value) in values.iter().enumerate() {
        lines.push(Line::from(vec![if state.selected() == Some(i) { "  › ".cyan().bold() } else { "    ".into() }, value.as_str().into(), if state.selected() == Some(i) { "  selected".dim() } else { "".into() }]));
    }
    f.render_widget(Paragraph::new(lines).wrap(Wrap { trim: false }), area);
}
'''
          p.write_text(s)
          PY
          cargo fmt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Redesign terminal interface"
          git push
      - run: cargo fmt --check
      - run: cargo check
