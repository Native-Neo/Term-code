name: CI
on: [push]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("src/main.rs"); s=p.read_text(); p.write_text(s[:s.index("fn draw(")]+base64.b64decode("    ").decode())'
          cargo fmt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Redesign terminal interface"
          git push
      - run: cargo fmt --check
      - run: cargo check
