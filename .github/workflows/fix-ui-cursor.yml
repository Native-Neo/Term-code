name: Fix UI cursor
on:
  push:
    paths:
      - '.github/workflows/fix-ui-cursor.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cursor rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui.rs')
          s = p.read_text()
          old = '''    for i in start..end {\n        let st = if sel.is_some_and(|(x, y)| i >= x && i < y) {\n            Style::default().bg(t.primary).fg(Color::Black)\n        } else {\n            Style::default().fg(t.text)\n        };\n        s.push(Span::styled(c[i].to_string(), st))\n    }\n    s.push(Span::styled(\n        "▌",\n        Style::default().fg(t.primary).add_modifier(Modifier::BOLD),\n    ));'''
          new = '''    let cursor_style = Style::default().fg(t.primary).add_modifier(Modifier::BOLD);\n    for i in start..=end {\n        if i == cur {\n            s.push(Span::styled("▌", cursor_style));\n        }\n        if i < end {\n            let st = if sel.is_some_and(|(x, y)| i >= x && i < y) {\n                Style::default().bg(t.primary).fg(Color::Black)\n            } else {\n                Style::default().fg(t.text)\n            };\n            s.push(Span::styled(c[i].to_string(), st));\n        }\n    }'''
          if old not in s:
              raise SystemExit('cursor block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt -- src/ui.rs
      - name: Commit
        run: |
          git config user.name 'NativeMc'
          git config user.email 'yashyt6246@gmail.com'
          git add src/ui.rs
          git diff --cached --quiet || git commit -m 'Fix visual input cursor position'
          git push
