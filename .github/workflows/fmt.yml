name: Format
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("src/main.rs"); s=p.read_text(); p.write_text(s+"" if False else s.replace("Block::default().borders(Borders::ALL", "Block::default().borders(Borders::NONE").replace(".highlight_symbol(\"> ")", ".highlight_symbol(\"› \")").replace("Block::default().borders(Borders::NONE).title(title)", "Block::default().borders(Borders::NONE).title(Span::styled(title, Style::default().cyan().bold()))"))'
          cargo fmt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Polish terminal UI"
          git push
      - run: cargo fmt --check
      - run: cargo check
