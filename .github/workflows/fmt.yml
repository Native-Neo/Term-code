name: Format
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.rs")
          s = p.read_text()
          s = s.replace(".collect()", ".collect::<Vec<_>>()")
          s = s.replace("    let hist = app.messages.clone();\n    tokio::spawn", "    let hist = app.messages.clone();\n    let tx = tx.clone();\n    tokio::spawn")
          p.write_text(s)
          PY
          cargo fmt
      - name: Commit fixes
        run: |
          if git diff --quiet -- src/main.rs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Fix compile errors"
          git push
