name: Fix main

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source
        run: |
          python3 - <<'PY'
          p='src/main.rs'
          s=open(p).read()
          s=s.replace('KeyCode::Backspace if !ctrl => {', 'KeyCode::Backspace => {')
          open(p,'w').write(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs
          git commit -m 'Fix setup input backspace'
          git push
