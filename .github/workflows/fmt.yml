name: Format

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix TUI source
        run: |
          python3 <<'PY'
          from pathlib import Path
          main=Path("src/main.rs")
          s=main.read_text()
          fixes={
            'let _=tx.send(EventMsg::Error(id,e))}})}\nfn send_followup':'let _=tx.send(EventMsg::Error(id,e))}});}\nfn send_followup',
            'let _=tx.send(EventMsg::Error(id,e))}})}\npub async fn request_direct':'let _=tx.send(EventMsg::Error(id,e))}});}\npub async fn request_direct',
            'let _=tx.send(EventMsg::Error(id,e))}})}\nasync fn load_models':'let _=tx.send(EventMsg::Error(id,e))}});}\nasync fn load_models',
            'a.config.model=Some(m);let _=a.save()}}':'a.config.model=Some(m);let _=a.save();}}',
          }
          for a,b in fixes.items(): s=s.replace(a,b)
          main.write_text(s)
          PY
      - name: Format main
        run: rustfmt --edition 2024 src/main.rs 2>/tmp/rustfmt-main.log
      - name: Upload main format error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-main-error
          path: /tmp/rustfmt-main.log
      - run: rustfmt --edition 2024 src/ui.rs
      - run: cargo check
      - name: Commit main only
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src/main.rs; then
            git add src/main.rs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fix streaming and input handling"
            git push
          fi
      - name: Commit UI only
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src/ui.rs; then
            git add src/ui.rs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fix chat auto-scroll"
            git push
          fi
