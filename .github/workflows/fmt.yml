name: Format

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix UI
        run: |
          sed -i 's/Modifier::BOLD))}else/Modifier::BOLD)}else/g' src/ui.rs
          python3 -c 'from pathlib import Path;p=Path("src/ui.rs");s=p.read_text();old="f.render_widget(Paragraph::new(l).block(block).scroll((a.scroll,0)).wrap(Wrap{trim:false}),parts.0)";new="let width=parts.0.width.saturating_sub(2).max(1) as usize;let height=parts.0.height.saturating_sub(2) as usize;let visual_lines=l.iter().map(|line|((line.width().max(1)+width-1)/width).max(1)).sum::<usize>();let max_scroll=visual_lines.saturating_sub(height);let scroll=max_scroll.saturating_sub(a.scroll as usize).min(u16::MAX as usize) as u16;f.render_widget(Paragraph::new(l).block(block).scroll((scroll,0)).wrap(Wrap{trim:false}),parts.0)";assert old in s;p.write_text(s.replace(old,new,1))'
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix TUI rendering and auto-scroll'
          git push
      - run: cargo fmt --check
      - run: cargo check
