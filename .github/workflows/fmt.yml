name: Format

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix UI
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/ui.rs"); s=p.read_text(); start=s.index("fn draw_setup_modal"); end=s.index("fn draw_input", start); setup="""fn draw_setup_modal(f:&mut Frame,a:&App,r:Rect,s:u8,t:&Theme){let x=centered_rect(65,75,r);f.render_widget(Clear,x);let title=match s{0=>"Step 1 of 3: Select Provider",1=>"Step 2 of 3: Enter API Key",2=>"Step 3 of 3: User Profile",3=>"Configuration Error",_=>"Setup Wizard"};f.render_widget(Block::default().borders(Borders::ALL).border_type(BorderType::Rounded).border_style(Style::default().fg(t.border_active)).title(Span::styled(format!(" [ Term Code Setup -- {} ] ",title),Style::default().fg(t.primary).add_modifier(Modifier::BOLD))),x);let inner=Layout::vertical([Constraint::Length(3),Constraint::Min(5),Constraint::Length(2)]).margin(1).split(x);f.render_widget(Paragraph::new(Line::from(vec![Span::styled(" [1] Provider ",if s==0{Style::default().bg(t.primary).fg(Color::Black).add_modifier(Modifier::BOLD)}else{Style::default().fg(t.text_muted)}),Span::styled(" --> ",Style::default().fg(t.text_dim)),Span::styled(" [2] API Key ",if s==1{Style::default().bg(t.primary).fg(Color::Black).add_modifier(Modifier::BOLD)}else{Style::default().fg(t.text_muted)}),Span::styled(" --> ",Style::default().fg(t.text_dim)),Span::styled(" [3] Profile ",if s==2{Style::default().bg(t.primary).fg(Color::Black).add_modifier(Modifier::BOLD)}else{Style::default().fg(t.text_muted)})])).alignment(Alignment::Center),inner[0]);match s{0=>{let i=PROVIDERS.iter().enumerate().map(|(n,p)|ListItem::new(Span::styled(format!("{}{}",if n==a.provider{" > "}else{"   "},p.name),if n==a.provider{Style::default().fg(t.primary).add_modifier(Modifier::BOLD)}else{Style::default().fg(t.text)}))).collect();f.render_widget(List::new(i).block(Block::default().borders(Borders::ALL).border_type(BorderType::Rounded).border_style(Style::default().fg(t.border_inactive)).title(" Select Cloud Provider ")),inner[1])},1=>{let m="*".repeat(a.api_input.chars().count());let key=if m.is_empty(){"<paste key here>".to_string()}else{m};let lines=vec![Line::from(""),Line::from(Span::styled("Please paste or type your API key for the selected provider:",Style::default().fg(t.text))),Line::from(""),Line::from(vec![Span::styled(" Key: ",Style::default().fg(t.primary).add_modifier(Modifier::BOLD)),Span::styled(key,Style::default().fg(t.warning)),Span::styled("_",Style::default().fg(t.primary))])];f.render_widget(Paragraph::new(lines).block(Block::default().borders(Borders::ALL).border_type(BorderType::Rounded).border_style(Style::default().fg(t.border_inactive)).title(" API Key Input ")),inner[1])},2=>{let name=if a.name_input.is_empty(){"Developer (default)".to_string()}else{a.name_input.clone()};let lines=vec![Line::from(""),Line::from(Span::styled("What should Term Code call you in greetings?",Style::default().fg(t.text))),Line::from(""),Line::from(vec![Span::styled(" Name: ",Style::default().fg(t.primary).add_modifier(Modifier::BOLD)),Span::styled(name,Style::default().fg(t.text)),Span::styled("_",Style::default().fg(t.primary))])];f.render_widget(Paragraph::new(lines).block(Block::default().borders(Borders::ALL).border_type(BorderType::Rounded).border_style(Style::default().fg(t.border_inactive)).title(" Profile Setup ")),inner[1])},3=>{let lines=vec![Line::from(""),Line::from(Span::styled("[ERR] Configuration Load Error:",Style::default().fg(t.error).add_modifier(Modifier::BOLD))),Line::from(""),Line::from(Span::styled(a.error.as_deref().unwrap_or("Invalid Config.json file found."),Style::default().fg(t.text))),Line::from(""),Line::from(Span::styled("Please fix or remove ~/.nativestuff/Config.json and restart.",Style::default().fg(t.text_muted)))];f.render_widget(Paragraph::new(lines).block(Block::default().borders(Borders::ALL).border_type(BorderType::Rounded).border_style(Style::default().fg(t.error)).title(" Config Error ")),inner[1])},_=>{}}let h=match s{0=>" [Up/Down] Navigate  |  [Enter] Confirm  |  [Ctrl+C] Quit ",1=>" [Type Key]  |  [Enter] Next Step  |  [Backspace] Delete ",2=>" [Type Name]  |  [Enter] Finish & Save  |  [Backspace] Delete ",3=>" [Ctrl+C] Quit Application ",_=>""};f.render_widget(Paragraph::new(Span::styled(h,Style::default().fg(t.text_muted))).alignment(Alignment::Center),inner[2])}
"""; s=s[:start]+setup+s[end:]; old="f.render_widget(Paragraph::new(l).block(block).scroll((a.scroll,0)).wrap(Wrap{trim:false}),parts.0)"; new="let width=parts.0.width.saturating_sub(2).max(1) as usize;let height=parts.0.height.saturating_sub(2) as usize;let visual_lines=l.iter().map(|line|((line.width().max(1)+width-1)/width).max(1)).sum::<usize>();let max_scroll=visual_lines.saturating_sub(height);let scroll=max_scroll.saturating_sub(a.scroll as usize).min(u16::MAX as usize) as u16;f.render_widget(Paragraph::new(l).block(block).scroll((scroll,0)).wrap(Wrap{trim:false}),parts.0)"; assert old in s; p.write_text(s.replace(old,new,1))'
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix TUI rendering and auto-scroll'
          git push
      - run: cargo fmt --check
      - run: cargo check
