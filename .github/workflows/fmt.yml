name: Format
on:
  push:
  pull_request:
jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/main.rs")
          s = p.read_text()
          marker = s.index("fn draw(")
          s = s[:marker] + r'''fn draw(f: &mut Frame, a: &App) {
    let area = f.area();
    let layout = Layout::vertical([
        Constraint::Length(1),
        Constraint::Min(3),
        Constraint::Length(2),
        Constraint::Length(1),
    ]).split(area);

    let provider = PROVIDERS[a.provider].name;
    let model = a.config.model.as_deref().unwrap_or("auto");
    let header = Line::from(vec![
        Span::raw("  "),
        "TERM CODE".bold().cyan(),
        Span::raw("  ·  "),
        provider.dim(),
        Span::raw(" / "),
        model.dim(),
    ]);
    f.render_widget(Paragraph::new(header), layout[0]);

    match a.mode {
        Mode::Chat => chat(f, a, layout[1]),
        Mode::Setup(step) => setup(f, a, layout[1], step),
        Mode::Models => picker(f, &a.models, &a.model_state, layout[1], "Models"),
        Mode::Providers => {
            let names = PROVIDERS.iter().map(|p| p.name.to_string()).collect::<Vec<_>>();
            picker(f, &names, &a.provider_state, layout[1], "Providers");
        }
    }

    let prompt = match a.mode {
        Mode::Chat => {
            if a.input.is_empty() {
                Line::from(vec!["  › ".bold().cyan(), "Ask anything…".dim()])
            } else {
                Line::from(vec!["  › ".bold().cyan(), a.input.as_str().into()])
            }
        }
        Mode::Setup(step) => setup_prompt(a, step),
        _ => Line::from("  ↑/↓ navigate  ·  Enter select  ·  Esc back".dim()),
    };
    f.render_widget(Paragraph::new(prompt), layout[2]);

    let status = if let Some(e) = a.error.as_deref() {
        Line::from(vec!["  ! ".red().bold(), e.red()])
    } else if a.busy {
        Line::from(vec!["  • ".magenta(), "Working…".dim()])
    } else {
        Line::from(vec![
            "  ".into(),
            a.status.as_str().dim(),
            "  ·  ".dim(),
            "/help".cyan(),
            "  /model  /provider  /new  /quit".dim(),
        ])
    };
    f.render_widget(Paragraph::new(status), layout[3]);
}

fn chat(f: &mut Frame, a: &App, area: Rect) {
    if a.messages.is_empty() {
        let width = area.width.saturating_sub(6);
        let lines = vec![
            Line::from(""),
            Line::from(vec!["  ".into(), a.greeting.as_str().bold()]),
            Line::from(""),
            Line::from(vec!["  ".into(), "Start with a question, idea, or task.".dim()]),
            Line::from(""),
            Line::from(vec!["  ".into(), "Commands".bold()]),
            Line::from(vec!["  ".into(), "/model".cyan(), "  choose a model".dim()]),
            Line::from(vec!["  ".into(), "/provider".cyan(), "  switch provider".dim()]),
            Line::from(vec!["  ".into(), "/new".cyan(), "  start a fresh conversation".dim()]),
        ];
        f.render_widget(Paragraph::new(lines).wrap(Wrap { trim: false }).max_width(width), area);
        return;
    }

    let mut lines = Vec::new();
    for message in &a.messages {
        if message.role == "user" {
            lines.push(Line::from(vec!["  › ".cyan().bold(), message.content.as_str().bold()]));
        } else {
            lines.push(Line::from(vec!["  Term Code ".magenta().bold()]));
            for (i, line) in message.content.lines().enumerate() {
                lines.push(Line::from(vec![
                    if i == 0 { "  ".into() } else { "    ".into() },
                    line.into(),
                ]));
            }
        }
        lines.push(Line::from(""));
    }
    f.render_widget(
        Paragraph::new(lines)
            .scroll((a.scroll, 0))
            .wrap(Wrap { trim: false }),
        area,
    );
}

fn setup(f: &mut Frame, a: &App, area: Rect, step: u8) {
    let inner = Layout::vertical([
        Constraint::Length(3),
        Constraint::Length(1),
        Constraint::Length(1),
        Constraint::Min(3),
    ])
    .split(area);
    let title = match step {
        0 => "Connect a provider",
        1 => "Add your API key",
        2 => "Personalize Term Code",
        _ => "Configuration error",
    };
    f.render_widget(Paragraph::new(title.bold().cyan()), inner[0]);

    match step {
        0 => {
            let items = PROVIDERS.iter().enumerate().map(|(i, p)| {
                let mark = if i == a.provider { "  › " } else { "    " };
                Line::from(vec![
                    mark.cyan().bold(),
                    p.name.into(),
                    if i == a.provider { "  selected".dim() } else { "".into() },
                ])
            }).collect::<Vec<_>>();
            f.render_widget(Paragraph::new(items), inner[3]);
        }
        1 => f.render_widget(Paragraph::new(Line::from(vec![
            "  ".into(), "API key: ".dim(), "•".repeat(a.api_input.len()).into()
        ])), inner[3]),
        2 => f.render_widget(Paragraph::new(Line::from(vec![
            "  ".into(), "Name: ".dim(), a.name_input.as_str().into()
        ])), inner[3]),
        _ => f.render_widget(Paragraph::new(vec![
            Line::from(""),
            Line::from(vec!["  ".into(), a.error.as_deref().unwrap_or("Invalid Config.json").red()]),
            Line::from(""),
            Line::from("  Press Esc or Q to exit.".dim()),
        ]), inner[3]),
    }
}

fn setup_prompt(a: &App, step: u8) -> Line<'_> {
    match step {
        0 => Line::from("  ↑/↓ choose provider  ·  Enter continue  ·  Esc quit".dim()),
        1 => Line::from("  › ".bold().cyan()),
        2 => Line::from(vec!["  › ".bold().cyan(), a.name_input.as_str().into()]),
        _ => Line::from("  Esc / Q exit".dim()),
    }
}

fn picker(f: &mut Frame, values: &[String], state: &ListState, area: Rect, title: &str) {
    let mut items = Vec::with_capacity(values.len() + 2);
    items.push(Line::from(vec!["  ".into(), title.bold().cyan()]));
    items.push(Line::from(""));
    for (i, value) in values.iter().enumerate() {
        let selected = state.selected() == Some(i);
        items.push(Line::from(vec![
            if selected { "  › ".cyan().bold() } else { "    ".into() },
            value.as_str().into(),
            if selected { "  selected".dim() } else { "".into() },
        ]));
    }
    f.render_widget(Paragraph::new(items).wrap(Wrap { trim: false }), area);
}
'''
          p.write_text(s)
          PY
          cargo fmt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Redesign terminal interface"
            git push
          fi
      - run: cargo fmt --check
      - run: cargo check
