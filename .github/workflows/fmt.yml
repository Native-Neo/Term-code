name: Format
on:
  push:
jobs:
  redesign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Redesign chat view
        run: python3 -c "import base64,re,pathlib; p=pathlib.Path('src/main.rs'); s=p.read_text(); x=base64.b64decode('').decode(); s=re.sub(r'fn chat\\(.*?(?=fn setup\\()',x+'\\n',s,flags=re.S); p.write_text(s)"
      - run: cargo fmt --check
      - run: cargo check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Redesign chat view"
          git push
