[package]
name = "term-code"
version = "0.1.0"
edition = "2024"
description = "A TUI cloud inference client"
license = "Apache-2.0"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
chrono = "0.4"
